<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML compiler</title>
    <link rel="icon" type="image/png" href="/asset/magento-brands-solid-full.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/navbar.css">

    <style>
        .terminal-loader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: #111;

            display: flex;
            justify-content: center;
            align-items: center;

            transition: opacity 0.5s ease;
        }

        .terminal-loader.hide {
            opacity: 0;
            pointer-events: none;
        }

        /* Loader Box */
        .terminal-loader .loader-box {
            border: 0.1em solid #333;
            background-color: #1a1a1a;
            color: #0f0;
            font-family: "Courier New", Courier, monospace;
            font-size: 1em;
            padding: 1.5em 1em;
            width: 12em;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }

        .terminal-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1.5em;
            background-color: #333;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            padding: 0 0.4em;
            box-sizing: border-box;
        }

        .terminal-controls {
            float: right;
        }

        .control {
            display: inline-block;
            width: 0.6em;
            height: 0.6em;
            margin-left: 0.4em;
            border-radius: 50%;
            background-color: #777;
        }

        .control.close {
            background-color: #e33;
        }

        .control.minimize {
            background-color: #ee0;
        }

        .control.maximize {
            background-color: #0b0;
        }

        .terminal-title {
            float: left;
            line-height: 1.5em;
            color: #eee;
        }

        .text {
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
            border-right: 0.2em solid #0f0;
            margin-top: 1.5em;

            animation:
                typeAndDelete 4s steps(11) infinite,
                blinkCursor 0.5s step-end infinite alternate;
        }

        @keyframes blinkCursor {
            50% {
                border-right-color: transparent;
            }
        }

        @keyframes typeAndDelete {

            0%,
            10% {
                width: 0;
            }

            45%,
            55% {
                width: 6.2em;
            }

            90%,
            100% {
                width: 0;
            }
        }
    </style>
</head>

<body>
    <!-- loder -->
    <div class="terminal-loader" id="loader">
        <div class="terminal-loader" id="loader">
            <div class="loader-box">
                <div class="terminal-header">
                    <div class="terminal-title">Status</div>
                    <div class="terminal-controls">
                        <div class="control close"></div>
                        <div class="control minimize"></div>
                        <div class="control maximize"></div>
                    </div>
                </div>
                <div class="text">Loading...</div>
            </div>
        </div>

        <div class="text">Loading...</div>
    </div>
    <!-- loder -->
    <nav class="custom-navbar"></nav>

    <div class="hero">
        <div class="hero-title-section">
            <h1 class="Manrope">
                code with <span id="element"></span><br>
                <span>next generation compiler</span>
            </h1>
            <div class="hero-description">
                We help thousands of students build coding skills and prepare for their careers, while empowering
                aspiring developers to learn, practice, and grow through real-world programming challenges.
            </div>
            <div class="hero-butn-group">
                <button class="for-student" type="button" id="studentBtn">For Student</button>
                <button class="for-teacher" type="button" id="teacherBtn">For Teacher</button>
            </div>
        </div>
        <div class="hero-sponor-section">
            <div class="brand-logo">
                <img src="asset/ilead.png" alt="" srcset="">
            </div>
        </div>
    </div>

    <script src="/js/navbar.js"></script>
    <script src="https://unpkg.com/typed.js@3.0.0/dist/typed.umd.js"></script>
    <script>
        var typed = new Typed('#element', {
            strings: ['python', 'javascripts', 'c', 'cpp', 'java'],
            typeSpeed: 130,
            loop: true,
            loopCount: Infinity,
        });
        const token = localStorage.getItem("authToken");
        const role = localStorage.getItem("userRole");
        const name = localStorage.getItem("userName");

        document.getElementById("studentBtn").addEventListener("click", function () {
            if (token) {
                if (role == 'student') {
                    window.location.href = '/coding-test'
                }
                else {
                    window.location.href = '/signin'
                }
            }
            else {
                window.location.href = '/signin'
            }
        });

        document.getElementById("teacherBtn").addEventListener("click", function () {
            window.location.href = "";
             if (token) {
                if (role == 'teacher') {
                    window.location.href = '/create-test'
                }
                else {
                    window.location.href = '/signin#teacher'
                }
            }
            else {
                window.location.href = '/signin#teacher'
            }
        });

        // loder
        window.addEventListener("load", () => {
            setTimeout(() => {
                const loader = document.getElementById("loader");
                loader.classList.add("hide");

                setTimeout(() => {
                    loader.remove(); // completely remove loader from DOM
                }, 500);
            }, 4000);
        });
    </script>
</body>

</html>
