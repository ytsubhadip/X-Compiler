<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playground - ML Compiler</title>
  <link rel="icon" type="image/png" href="/asset/magento-brands-solid-full.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/codemirror-5.65.21/lib/codemirror.css">
  <script src="/codemirror-5.65.21/lib/codemirror.js"></script>
  <script src="/codemirror-5.65.21/mode/clike/clike.js"></script>
  <link rel="stylesheet" href="/codemirror-5.65.21/theme/darcula.css">
  <link rel="stylesheet" href="/codemirror-5.65.21/theme/night.css">
  <script src="/codemirror-5.65.21/addon/edit/closebrackets.js"></script>
  <script src="/codemirror-5.65.21/mode/python/python.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/compiler_css/playground.css">
  
</head>

<body class="landing-page d-flex flex-column" style="height: 100vh; overflow: hidden;">

  <nav class="custom-navbar"></nav>

  <div class="row gx-0 ide-workspace">
    <div class="col-12">
      <div class="row gx-0">
        <div class="col-12 col-lg-6 d-flex">
          <div class="pane-card editor-pane d-flex flex-column w-100">
            <div class="editor-header">
              <div class="custom-select-wrapper">
                <label class="visually-hidden" for="inlineFormSelectPref">Language</label>
                <div class="custom-select-shell">
                  <div class="custom-dropdown" id="customLanguageDropdown">
                    <button type="button" class="custom-dropdown-btn" id="customDropdownBtn" aria-haspopup="listbox" aria-expanded="false">
                      <span class="custom-dropdown-btn-content">
                        <i class="bi bi-code-slash custom-dropdown-icon" id="customDropdownIcon"></i>
                        <span class="custom-dropdown-label" id="customDropdownLabel">Choose Language</span>
                      </span>
                      <i class="bi bi-chevron-down custom-dropdown-chevron"></i>
                    </button>
                    <ul class="custom-dropdown-menu" id="customDropdownMenu" role="listbox">
                      <li data-value="python" class="custom-dropdown-item" role="option">
                        <img src="/asset/python.png" alt="Python Logo" class="dropdown-lang-logo">
                        <span>Python</span>
                      </li>
                      <li data-value="javascript" class="custom-dropdown-item" role="option">
                        <img src="/asset/js.png" alt="JavaScript Logo" class="dropdown-lang-logo">
                        <span>JavaScript</span>
                      </li>
                      <li data-value="cpp" class="custom-dropdown-item" role="option">
                        <img src="/asset/cpp.png" alt="C++ Logo" class="dropdown-lang-logo">
                        <span>C++</span>
                      </li>
                      <li data-value="c" class="custom-dropdown-item" role="option">
                        <img src="/asset/c.png" alt="C Logo" class="dropdown-lang-logo">
                        <span>C</span>
                      </li>
                      <li data-value="java" class="custom-dropdown-item" role="option">
                        <img src="/asset/java.png" alt="Java Logo" class="dropdown-lang-logo">
                        <span>Java</span>
                      </li>
                    </ul>
                  </div>
                  
                  <select class="form-select custom-select" id="inlineFormSelectPref" style="display: none !important;">
                    <option selected value="noL">Choose Language</option>
                    <option value="python">Python</option>
                    <option value="javascript">JavaScript</option>
                    <option value="cpp">C++</option>
                    <option value="c">C</option>
                    <option value="java">Java</option>
                  </select>
                </div>
              </div>

              <button type="button" class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle editor theme">
                <i class="bi bi-moon-stars-fill"></i>
                <span>Theme</span>
              </button>

              <div class="editor-actions-wrapper">
                <button type="button" class="btn btn-success btn-action" id="coderun">
                  <i class="bi bi-play-fill"></i> <span>Run</span>
                </button>

                <button type="button" class="btn btn-success btn-action" id="" disabled>
                  <i class="bi bi-cloud-arrow-up-fill"></i> <span>Save</span>
                </button>
              </div>
            </div>

            <div class="editor-body flex-grow-1" style="min-height:0">
              <textarea type="text" class="form-control h-100" id="editor"></textarea>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-6 d-flex">
          <div class="pane-card console-pane d-flex flex-column w-100">
            <div class="console-header">
              <span class="console-header-title"><i class="bi bi-terminal-fill me-2"></i>Console</span>

              <button type="button" class="clear-console">
                <i class="bi bi-trash3"></i>
                <span>Clear</span>
              </button>
            </div>

            <div class="console-body flex-grow-1 d-flex flex-column" style="min-height:0">
              <div class="console-panel">
                <div class="console-panel-header">
                  <span><i class="bi bi-box-arrow-right me-2"></i>Output</span>
                  <span class="console-panel-badge">Live</span>
                </div>
                <textarea class="console-output" id="output" readonly
                  placeholder="Output will appear here after compiling..."></textarea>
              </div>

              <div class="console-panel input-panel">
                <div class="console-panel-header">
                  <span><i class="bi bi-keyboard-fill me-2"></i>Input</span>
                  <span class="console-panel-badge subtle">stdin</span>
                </div>
               <textarea id="customInput" class="console-input" spellcheck="false"
                placeholder="If your code requires input, type it here BEFORE clicking Run Code..."></textarea>
              </div>

              <div class="console-footer">
                <div class="console-stat">
                  <span>Execution Time:</span>
                  <span class="console-stat-value"><span id="execTime">-</span> ms</span>
                </div>
                <div class="console-stat">
                  <span>Estimated Complexity:</span>
                  <span class="console-stat-value" id="complexity">-</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Initialize theme state from localStorage (default is light theme)
    var preferredTheme = localStorage.getItem('playground-theme') || 'light';
    var editorTheme = preferredTheme === 'dark' ? 'night' : 'default';

    var editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
      mode: "text/x-c++src",
      theme: editorTheme,
      lineNumbers: true,
      autoCloseBrackets: true
    });
    window.wpCodeEditorInstance = editor;

    // Apply theme changes to DOM and CodeMirror instance
    var themeToggleBtn = document.getElementById('themeToggleBtn');
    
    function applyTheme(theme) {
      if (theme === 'dark') {
        document.body.classList.add('dark-theme');
        editor.setOption('theme', 'night');
        if (themeToggleBtn) {
          themeToggleBtn.innerHTML = '<i class="bi bi-sun-fill"></i> <span>Light Theme</span>';
        }
        localStorage.setItem('playground-theme', 'dark');
      } else {
        document.body.classList.remove('dark-theme');
        editor.setOption('theme', 'default');
        if (themeToggleBtn) {
          themeToggleBtn.innerHTML = '<i class="bi bi-moon-stars-fill"></i> <span>Dark Theme</span>';
        }
        localStorage.setItem('playground-theme', 'light');
      }
    }

    // Initialize layout theme state
    applyTheme(preferredTheme);

    // Set up toggle click event
    if (themeToggleBtn) {
      themeToggleBtn.addEventListener('click', function() {
        var currentTheme = localStorage.getItem('playground-theme') || 'light';
        var nextTheme = currentTheme === 'light' ? 'dark' : 'light';
        applyTheme(nextTheme);
      });
    }
  </script>

  <script src="/js/navbar.js"></script>
  <script src="/js/run_compiler/compilerRunner.js"></script>
  <script src="/js/language.js"></script>
   <script src="/js/inspect_off.js"></script> 

</body>

</html>
