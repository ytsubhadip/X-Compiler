<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add question</title>
    <link rel="icon" type="image/png" href="/asset/magento-brands-solid-full.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/create_test/question_page.css">
</head>

<body style="min-height: 100vh; overflow-y: auto;">
    <!-- navbar start -->
    <nav class="custom-navbar"></nav>
    <!-- navbar end -->

    <div class="starry-background-canvas">
        <div id="stars"></div>
        <div id="stars2"></div>
        <div id="stars3"></div>
    </div>

    <!-- main -->
    <div class="container">
        <div class="left-side-div">
            <button type="button">
                <p>New Question</p>
            </button>
            <div class="question-queue">
                <span>DRAFTS</span>
                <div class="question-container">
                    <div class="question-one">
                        <i class="fa-solid fa-square-poll-horizontal" style="color: rgb(254, 254, 254);"></i>
                        <p>Two Sum</p>
                    </div>
                </div>
            </div>

        </div>
        <div class="right-side-div">
            <div class="question-pannel">
                <div class="input-group">
                    <p class="question-title"> PROBLEM TITLE</p>
                    <input type="text" name="" id="" required>
                </div>
                <div class="input-group">
                    <div class="difficulty">
                        <p>DIFFICULTY</p>
                        <div class="difficulty-btn-group">
                            <button type="button" class="btn-easy">Easy</button>
                            <button type="button" class="btn-medium">Medium</button>
                            <button type="button" class="btn-hard">Hard</button>
                        </div>
                    </div>
                    <div class="topic-tags">
                        <p>TOPIC TAGS</p>
                        <div class="tag-container" id="tagContainer">
                            <input type="text" id="tagInput" placeholder="Type a tag and press Enter">
                        </div>
                    </div>
                </div>
                <div class="input-group">
                    <p>PROBLEM DESCRIPTION</p>
                    <div class="probleam-desc">
                        <textarea name="" id=""></textarea>
                    </div>

                </div>
                <div class="input-group examples-section">
                    <p>TEST CASE EXAMPLES</p>
                    <div class="examples-list" id="examplesList"></div>
                    <button type="button" id="addExampleBtn">
                        <i class="fa-solid fa-plus" style="color: rgb(254, 254, 254);"></i>
                        Add Examples</button>
                </div>
            </div>
        </div>
        <div class="footer-button">
            <button type="button">Add in Queue</button>
            <button type="button">Save Assignment</button>
        </div>
    </div>

</body>
<script src="/js/navbar.js"></script>
<script src="/js/question_page.js"></script>

</html>
