<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment History - Teacher Panel</title>
    <link rel="icon" type="image/png" href="/asset/magento-brands-solid-full.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/animated-Element/star_background.css">
    
    <!-- 🟢 LINKED EXTERNAL STYLE SHEET WITH FORCE CACHE-BUSTING QUERY STRINGS -->
    <link rel="stylesheet" href="/css/create_test/test_history.css?v=1.0.3">
</head>

<body style="min-height: 100vh; background-color: #0d0f12; color: #fff; overflow-x: hidden;">

    <nav class="custom-navbar"></nav>

    <div class="starry-background-canvas">
        <div id="stars"></div>
        <div id="stars2"></div>
        <div id="stars3"></div>
    </div>

    <div class="container py-5" style="position: relative; z-index: 10;">
        <div class="d-flex align-items-center gap-3 mb-2">
            <i class="bi bi-clock-history text-success h2 m-0 animate-pulse-glow"></i>
            <h1 class="m-0 fw-bold font-sans">Assessment History</h1>
        </div>
        <p class="text-muted mb-4">Track, manage, and audit all technical code assessments deployed across cloud environments.</p>

        <div id="historyGridContainer" class="row g-4 mt-2"></div>

        <div id="historyViewStateLoader" class="text-center py-5">
            <div class="spinner-border text-success" role="status">
                <span class="visually-hidden">Syncing Cluster...</span>
            </div>
            <p class="text-muted small mt-2 m-0">Compiling Historic Manifest Tracks From Cloud Instance...</p>
        </div>
    </div>

    <script src="/js/test_history.js"></script>
    <script src="/js/navbar.js"></script>
</body>
</html>
