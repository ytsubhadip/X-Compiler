<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Test Form</title>
    <link rel="icon" type="image/png" href="/asset/magento-brands-solid-full.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/create_test/create_test_form.css">
    <!-- <link rel="stylesheet" href="/css/loder/loder.css"> -->
</head>

<body>

        <nav class="custom-navbar"></nav>
        <h1>Create Test</h1>
        <p>Design a new technical assessment for your students.</p>

        <div class="from-container">
            <form id="formCreateTestAssessment">
            
                <div class="form-group">
                    <label for="testName">Test Name</label>
                    <input type="text" id="testName" placeholder="e.g. Data Structures & Algorithms" required>
                </div>

                <div class="form-group">
                    <div class="child-div">
                        <label for="testDepartment">Department</label>
                        <div class="glass-custom-select-wrapper" id="deptDropdownContainer">
                            <div class="glass-custom-select-trigger" id="deptSelectTrigger">
                                <span id="deptSelectValue">Select Department</span>
                                <i class="bi bi-chevron-down chevron-icon"></i>
                            </div>
                            <div class="glass-custom-select-options" id="deptSelectOptions">
                                <div class="glass-custom-select-option" data-value="Bsc Data Science">Bsc Data Science</div>
                                <div class="glass-custom-select-option" data-value="Bsc Cyber Security">Bsc Cyber Security</div>
                                <div class="glass-custom-select-option" data-value="BCA">BCA</div>
                            </div>
                            <select id="testDepartment" required class="visually-hidden-select">
                                <option value="" disabled selected hidden>Select Department</option>
                                <option value="Bsc Data Science">Bsc Data Science</option>
                                <option value="Bsc Cyber Security">Bsc Cyber Security</option>
                                <option value="BCA">BCA</option>
                            </select>
                        </div>
                    </div>
                
                    <div class="child-div">
                        <label for="testSemester">Semester</label>
                        <div class="glass-custom-select-wrapper" id="semDropdownContainer">
                            <div class="glass-custom-select-trigger" id="semSelectTrigger">
                                <span id="semSelectValue">Select Semester</span>
                                <i class="bi bi-chevron-down chevron-icon"></i>
                            </div>
                            <div class="glass-custom-select-options" id="semSelectOptions">
                                <div class="glass-custom-select-option" data-value="1">1</div>
                                <div class="glass-custom-select-option" data-value="2">2</div>
                                <div class="glass-custom-select-option" data-value="3">3</div>
                                <div class="glass-custom-select-option" data-value="4">4</div>
                                <div class="glass-custom-select-option" data-value="5">5</div>
                                <div class="glass-custom-select-option" data-value="6">6</div>
                                <div class="glass-custom-select-option" data-value="7">7</div>
                                <div class="glass-custom-select-option" data-value="8">8</div>
                            </div>
                            <select id="testSemester" required class="visually-hidden-select">
                                <option value="" disabled selected hidden>Select Semester</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                            </select>
                        </div>
                    </div>
                </div>
            
                <div class="form-group">
                    <div class="child-div">
                        <label for="testDuration">Duration (Minutes)</label>
                        <input type="number" id="testDuration" placeholder="e.g. 90" min="1" required>
                    </div>
                
                </div>

                <div class="question-group">
                    <div class="question-header">
                        <h3>Questions Canvas</h3>
                        <span id="labelQuestionCounter">0 Selected</span>
                    </div>

                    <div class="question-actions">
                        <button type="button" id="addQuestionBtn" class="action-btn">
                            <i class="bi bi-plus-circle"></i> Add Question Manually
                        </button>
                            <!-- <span style="text-align: center; font-size: 0.7rem;">OR</span> -->
                        <!-- <div class="upload-zone" id="questionUploadZone">
                            <input type="file" id="questionFileInput" accept=".pdf,.xlsx,.xls,.doc,.docx" style="display: none;">
                            <div class="upload-content" id="uploadContentText">
                                <i class="bi bi-cloud-arrow-up upload-icon"></i>
                                <span>Upload Questions (PDF, Excel, Doc)</span>
                                <span class="upload-limits">Max size: 10MB</span>
                            </div>
                            <div class="file-info" id="fileInfoDisplay" style="display: none;">
                                <i class="bi bi-file-earmark-check file-icon"></i>
                                <span class="file-name" id="selectedFileName">filename.pdf</span>
                                <button type="button" class="remove-file-btn" id="removeFileBtn">
                                    <i class="bi bi-x"></i>
                                </button>
                            </div>
                        </div> -->
                    </div>
                </div>
            
                <button type="submit" id="btnSubmitTestForm">Create Test Assessment</button>
                
                <button type="button" id="btnBack" style="background: #ffffff; color: #111; border: 1px solid rgba(0,0,0,.12); border-radius: 0.75rem; padding: 0.75rem 1.25rem; font-weight: 600; box-shadow: 0 1px 6px rgba(0,0,0,.08); transition: transform .2s ease, background .2s ease; margin-top: 20px;">Back</button>

            </form>
        </div>

       
        <script>
            document.getElementById("btnBack").addEventListener('click', (e)=>{
                window.location.href = "/teacher/dashboard"
            })
        </script>

        <script src="/js/create_test_form.js"></script>
        <script src="/js/navbar.js"></script>
        <script src="/js/inspect_off.js"></script>
</body>
</html>
