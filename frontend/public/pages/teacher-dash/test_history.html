<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment History - Teacher Panel</title>
     <link rel="icon" type="image/png" href="/asset/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/navbar.css">
    
    <!-- 🟢 LINKED EXTERNAL STYLE SHEET WITH FORCE CACHE-BUSTING QUERY STRINGS -->
    <link rel="stylesheet" href="/css/create_test/test_history.css?v=1.0.3">
    <script src="/js/custom-alert.js"></script>
</head>

<body style="min-height: 100vh; overflow-x: hidden;">

    <nav class="custom-navbar"></nav>

    <div class="glowing-orbs-container">
        <div class="glowing-orb orb-1"></div>
        <div class="glowing-orb orb-2"></div>
    </div>

    <div class="container py-5" style="position: relative; z-index: 10;">
        <!-- Back Navigation -->
        <div class="mb-4">
            <a href="/teacher/dashboard" class="btn-back">
                <i class="bi bi-arrow-left"></i> Back to Dashboard
            </a>
        </div>

        <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4">
            <div class="d-flex align-items-center gap-3">
                <i class="bi bi-clock-history text-success h2 m-0 animate-pulse-glow"></i>
                <h1 class="m-0 fw-bold font-sans">Assessment History</h1>
            </div>
            <a href="/teacher/test-form" class="btn-header-create-test">
                <i class="bi bi-plus-lg"></i> Create Test
            </a>
        </div>
        
        <!-- Search & Filter Section -->
        <div class="filter-wrapper mb-4">
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <div class="glass-input-group">
                        <i class="bi bi-search input-icon"></i>
                        <input type="text" id="examSearchInput" placeholder="Search by exam name..." class="glass-input-control" autocomplete="off">
                        <button type="button" id="clearExamSearch" class="clear-btn" style="display: none;">
                            <i class="bi bi-x-circle-fill"></i>
                        </button>
                    </div>
                </div>
                <div class="col-12 col-md-6">
                    <div class="glass-custom-select" id="deptFilterDropdown">
                        <div class="glass-select-trigger" id="deptSelectTrigger">
                            <div class="d-flex align-items-center gap-2">
                                <i class="bi bi-building input-icon"></i>
                                <span id="deptSelectValue">All Departments</span>
                            </div>
                            <i class="bi bi-chevron-down chevron-icon"></i>
                        </div>
                        <div class="glass-select-options" id="deptSelectOptions">
                            <div class="glass-select-option active" data-value="">All Departments</div>
                            <div class="glass-select-option" data-value="Bsc Data Science">Bsc Data Science</div>
                            <div class="glass-select-option" data-value="Bsc Cyber Security">Bsc Cyber Security</div>
                            <div class="glass-select-option" data-value="BCA">BCA</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="historyGridContainer" class="row g-4 mt-2"></div>

        <div id="historyViewStateLoader" class="text-center py-5">
            <div class="spinner-border text-success" role="status">
                <span class="visually-hidden">Syncing Cluster...</span>
            </div>
            <p class="text-muted small mt-2 m-0">Compiling Historic Manifest Tracks From Cloud Instance...</p>
        </div>
    </div>

    <script src="/js/test_history.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/inspect_off.js"></script>
</body>
</html>
