<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="icon" type="image/png" href="/asset/magento-brands-solid-full.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/auth_css/signin.css">
    <link rel="stylesheet" href="/css/animated-Element/button.css">
    <link rel="stylesheet" href="/css/animated-Element/star_background.css">
    <link rel="stylesheet" href="/css/loder/loder.css">

    <style>
        .button:hover i {
            animation: spin-reverse 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes spin-reverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }
    </style>
</head>

<body>
      <div class="loader-wrapper">
        <div class="loader"></div>
    </div>
    <div class="starry-background-canvas">
        <div id="stars"></div>
        <div id="stars2"></div>
        <div id="stars3"></div>
    </div>
    <main class="auth-wrapper">
        <div class="auth-container" style="position: relative; z-index: 10;">
            <a href="/" class="back-to-home-link"><i class="bi bi-arrow-left"></i> Back to Home</a>

            <div class="auth-card">
                <div class="auth-header">
                    <i class="fa-brands fa-magento brand-icon"></i>
                    <h2 id="authTitle">Forgot Password</h2>
                </div>

                <div class="auth-form-wrapper">
                    <form class="auth-form" id="formForgotPasswordReset">

                        <div class="form-group">
                            <label for="Email">Email Address</label>
                            <div class="input-wrapper">
                                <i class="bi bi-envelope-fill input-icon"></i>
                                <input class="input-control" type="email" id="Email" required
                                    placeholder="name@domain.com">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="RollNumber">University Roll Number / UID</label>
                            <div class="input-wrapper">
                                <i class="bi bi-card-text input-icon"></i>
                                <input class="input-control" type="text" id="RollNumber" required
                                    placeholder="e.g., 30001222001">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="Password">New Password</label>
                            <div class="input-wrapper">
                                <i class="bi bi-lock-fill input-icon"></i>
                                <input class="input-control password-input" type="password" id="Password" required
                                    placeholder="••••••••">
                                <i class="bi bi-eye-slash-fill toggle-password"
                                    onclick="togglePasswordVisibility('Password', this)"></i>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="ConfirmPassword">Re-Type New Password</label>
                            <div class="input-wrapper">
                                <i class="bi bi-shield-lock-fill input-icon"></i>
                                <input class="input-control password-input" type="password" id="ConfirmPassword"
                                    required placeholder="••••••••">
                                <i class="bi bi-eye-slash-fill toggle-password"
                                    onclick="togglePasswordVisibility('ConfirmPassword', this)"></i>
                            </div>
                        </div>

                        <div class="button-container">
                            <button class="button btn-auth-submit" type="submit" id="btnSubmitSignup"
                                aria-label="Submit small">
                                <i class="fa-solid fa-arrow-rotate-left fa-spin-reverse"
                                    style="color: rgb(20, 20, 21);"></i>
                                &nbsp;&nbsp;
                                Reset Password
                            </button>
                        </div>
                        
                        <div id="resetStatusAlertDisplay" class="text-center small mt-3 fw-bold" style="display: none;"></div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>

<script>
    function togglePasswordVisibility(inputId, toggleIcon) {
        const passwordInput = document.getElementById(inputId);
        if (passwordInput) {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('bi-eye-slash-fill');
                toggleIcon.classList.add('bi-eye-fill');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('bi-eye-fill');
                toggleIcon.classList.add('bi-eye-slash-fill');
            }
        }
    }

    // =========================================================================
    // 🟢 ASYNCHRONOUS FORM PROCESSING TRANSACTION CONTROLLER
    // =========================================================================
    document.getElementById("formForgotPasswordReset").addEventListener("submit", async (e) => {
        e.preventDefault();

        const emailVal = document.getElementById("Email").value.trim();
        const rollVal = document.getElementById("RollNumber").value.trim(); // Scrape the secure UID token
        const passVal = document.getElementById("Password").value;
        const confirmPassVal = document.getElementById("ConfirmPassword").value;
        const alertBox = document.getElementById("resetStatusAlertDisplay");
        const submitBtn = document.getElementById("btnSubmitSignup");

        // Front-end sanity logic verification check
        if (passVal !== confirmPassVal) {
            showAlertMessage("Password entries do not match. Please verify configurations.", "text-danger");
            return;
        }

        if (passVal.length < 6) {
            showAlertMessage("Security Exception: New password must contain at least 6 characters.", "text-danger");
            return;
        }

        try {
            if (submitBtn) submitBtn.disabled = true;
            showAlertMessage("Initiating identity verification check...", "text-warning");

            // 🟢 UPDATED FETCH PAYLOAD: Pushing email, rollNumber, and new password parameters to backend
            const response = await fetch("/api/auth/reset-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: emailVal, rollNumber: rollVal, password: passVal })
            });

            const data = await response.json();

            if (response.ok && data.success === true) {
                showAlertMessage(data.message, "text-success");
                
                // Route user cleanly to login screen upon success parameters matching
                setTimeout(() => {
                    window.location.href = "/signin"; 
                }, 1500);
            } else {
                showAlertMessage(data.error || "The server rejected this mutation call string.", "text-danger");
                if (submitBtn) submitBtn.disabled = false;
            }

        } catch (err) {
            console.error("Forgot password client breakdown fault:", err);
            showAlertMessage("Transmission Failure: Unable to handshake with cloud clusters.", "text-danger");
            if (submitBtn) submitBtn.disabled = false;
        }

        function showAlertMessage(msg, bootstrapTextColorClass) {
            if (!alertBox) return;
            alertBox.innerText = msg;
            alertBox.className = `text-center small mt-3 fw-bold ${bootstrapTextColorClass}`;
            alertBox.style.display = "block";
        }
    });
</script>
 <script src="/js/loder.js"></script>

</html>
