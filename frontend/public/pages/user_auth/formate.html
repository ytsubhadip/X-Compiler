<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
     <link rel="icon" type="image/png" href="/asset/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth_css/signin.css">
    <link rel="stylesheet" href="/css/animated-Element/button.css">
    <link rel="stylesheet" href="/css/animated-Element/star_background.css">
    <link rel="stylesheet" href="/css/loder/loder.css">
</head>

<body>
    <div class="login-loder">
        <div class="loader">
            <span><span></span><span></span><span></span><span></span></span>
            <div class="base">
                <span></span>
                <div class="face"></div>
            </div>
        </div>
        <div class="longfazers">
            <span></span><span></span><span></span><span></span>
        </div>
    </div>

    <main class="auth-wrapper" id="authWrapper">
        <div class="auth-container" id="authContainer" style="position: relative; z-index: 10;">
            <a href="/" class="back-to-home-link"><i class="bi bi-arrow-left"></i> Back to Home</a>

            <div class="auth-card">
                <div class="auth-header">
                     <img src="../asset/logo.png" class="fa-brands fa-magento brand-icon" alt="brand logo">
                    <h2 id="authTitle">Forgot Password</h2>
                </div>

                <div class="auth-form-wrapper">
                    <form class="auth-form" id="formForgotPasswordReset">

                        <div class="form-group">
                            <label for="Email">Email Address</label>
                            <div class="input-wrapper">
                                <i class="bi bi-envelope-fill input-icon"></i>
                                <input class="input-control" type="email" id="Email" required
                                    placeholder="name@domain.com">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="RollNumber">University Roll Number / UID</label>
                            <div class="input-wrapper">
                                <i class="bi bi-card-text input-icon"></i>
                                <input class="input-control" type="text" id="RollNumber" required
                                    placeholder="e.g., 30001222001">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="Password">New Password</label>
                            <div class="input-wrapper">
                                <i class="bi bi-lock-fill input-icon"></i>
                                <input class="input-control password-input" type="password" id="Password" required
                                    placeholder="••••••••">
                                <i class="bi bi-eye-slash-fill toggle-password"
                                    onclick="togglePasswordVisibility('Password', this)"></i>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="ConfirmPassword">Re-Type New Password</label>
                            <div class="input-wrapper">
                                <i class="bi bi-shield-lock-fill input-icon"></i>
                                <input class="input-control password-input" type="password" id="ConfirmPassword"
                                    required placeholder="••••••••">
                                <i class="bi bi-eye-slash-fill toggle-password"
                                    onclick="togglePasswordVisibility('ConfirmPassword', this)"></i>
                            </div>
                        </div>

                        <button class="btn-auth-submit btn-signup-submit" type="submit" id="btnSubmitForgotPassword">
                            <span class="spinner-border spinner-border-sm me-2 d-none" id="forgotLoader" role="status" aria-hidden="true"></span>
                            <span id="forgotBtnText"><i class="bi bi-arrow-clockwise me-1"></i> Reset Password</span>
                        </button>

                        <div id="resetStatusAlertDisplay" class="text-center small mt-3 fw-bold" style="display: none;">
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>

<script>
    function togglePasswordVisibility(inputId, toggleIcon) {
        const passwordInput = document.getElementById(inputId);
        if (passwordInput) {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('bi-eye-slash-fill');
                toggleIcon.classList.add('bi-eye-fill');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('bi-eye-fill');
                toggleIcon.classList.add('bi-eye-slash-fill');
            }
        }
    }

</script>
<script src="/js/loder.js"></script>
<script src="/js/inspect_off.js"></script>
<script src="/js/user_auth/reset_password.js"></script>

</html>
