<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ML compiler</title>
     <link rel="icon" type="image/png" href="/asset/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth_css/signin.css">
    <link rel="stylesheet" href="/css/loder/loder.css">
    <!-- <script src="/js/custom-alert.js"></script> -->
</head>

<body class="landing-page d-flex flex-column">
    <div class="login-loder">

        <div class="loader">
            <span><span></span><span></span><span></span><span></span></span>
            <div class="base">
                <span></span>
                <div class="face"></div>
            </div>
        </div>
        <div class="longfazers">
            <span></span><span></span><span></span><span></span>
        </div>
    </div>

    <main class="auth-wrapper" id="authWrapper">
        <div id="authContainer" class="auth-container" style="position: relative; z-index: 10;">
            <a href="/" class="back-to-home-link"><i class="bi bi-arrow-left"></i> Back to Home</a>

            <div class="auth-card">
                <div class="auth-header">
                     <img src="../asset/logo.png" class="fa-brands fa-magento brand-icon" alt="brand logo">
                    <h2 id="authTitle">Welcome Back</h2>
                    <p id="authSubtitle">Log in to X Compiler to compile and run your solutions as a student.</p>
                </div>

                <div class="persona-selector-container" id="personaSelectorContainer">
                    <div class="persona-indicator" id="personaIndicator"></div>
                    <button class="persona-tab active" id="btnTabStudent" type="button">
                        <i class="bi bi-mortarboard-fill me-2"></i>Student
                    </button>
                    <button class="persona-tab" id="btnTabTeacher" type="button">
                        <i class="bi bi-person-workspace me-2"></i>Teacher
                    </button>
                </div>

                <div class="auth-form-wrapper">
                    <form class="auth-form" id="formSignin">

                        <div class="form-group">
                            <label for="signinEmail">Email Address</label>
                            <div class="input-wrapper">
                                <i class="bi bi-envelope-fill input-icon"></i>
                                <input class="input-control" type="email" id="signinEmail" required
                                    placeholder="name@domain.com">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="signinPassword">Password</label>
                            <div class="input-wrapper">
                                <i class="bi bi-lock-fill input-icon"></i>
                                <input class="input-control password-input" type="password" id="signinPassword" required
                                    placeholder="••••••••">
                                <i class="bi bi-eye-slash-fill toggle-password"
                                    onclick="togglePasswordVisibility('signinPassword', this)"></i>
                            </div>
                        </div>

                        <div class="form-group form-group-dynamic" id="groupTeacherUid">
                            <label for="signinTeacherUid">Teacher Unique ID</label>
                            <div class="input-wrapper">
                                <i class="bi bi-shield-lock-fill input-icon"></i>
                                <input class="input-control" type="text" id="signinTeacherUid" placeholder="TCH-10029">
                            </div>
                        </div>

                        <div class="form-actions">
                            <a href="/password-formate" class="forgot-password">Forgot password?</a>
                        </div>

                        <button class="btn-auth-submit btn-signin-submit" type="submit" id="btnSubmitSignin">
                            <span class="spinner-border spinner-border-sm me-2 d-none" id="signinLoader" role="status" aria-hidden="true"></span>
                            <span id="signinBtnText"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In</span>
                        </button>

                    </form>
                </div>

                <div class="auth-card-footer mt-4 text-center">
                    <p class="mb-0 " style="font-size: 0.9rem;">
                        Don't have an account? <a href="/signup" class="auth-redirect-link">Sign Up</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script>

        const btnTabStudent = document.getElementById('btnTabStudent');
        const btnTabTeacher = document.getElementById('btnTabTeacher');
        const personaSelectorContainer = document.getElementById('personaSelectorContainer');
        const btnSubmitSignin = document.getElementById('btnSubmitSignin');
        const authSubtitle = document.getElementById('authSubtitle');

        let activeRole = 'student';

        function selectStudentRole() {
            btnTabStudent.classList.add('active');
            btnTabTeacher.classList.remove('active');
            personaSelectorContainer.classList.remove('teacher-active');
            btnSubmitSignin.className = "btn-auth-submit btn-signin-submit";
            btnSubmitSignin.removeAttribute('style');

            const groupTeacherUid = document.getElementById('groupTeacherUid');
            const signinTeacherUid = document.getElementById('signinTeacherUid');
            if (groupTeacherUid && signinTeacherUid) {
                groupTeacherUid.classList.remove('active');
                signinTeacherUid.required = false;
            }
            activeRole = 'student';
            authSubtitle.innerText = "Log in to X Compiler to compile and run your solutions as a student.";
        }

        function selectTeacherRole() {
            btnTabStudent.classList.remove('active');
            btnTabTeacher.classList.add('active');
            personaSelectorContainer.classList.add('teacher-active');
            btnSubmitSignin.style.backgroundColor = "#3b82f6";
            btnSubmitSignin.style.borderColor = "#3b82f6";
            btnSubmitSignin.style.color = "#ffffff";
            btnSubmitSignin.style.boxShadow = "0 4px 12px rgba(59, 130, 246, 0.15)";

            const groupTeacherUid = document.getElementById('groupTeacherUid');
            const signinTeacherUid = document.getElementById('signinTeacherUid');
            if (groupTeacherUid && signinTeacherUid) {
                groupTeacherUid.classList.add('active');
                signinTeacherUid.required = true;
            }
            activeRole = 'teacher';
            authSubtitle.innerText = "Log in to X Compiler to compile and run your solutions as a teacher.";
        }

        btnTabStudent.addEventListener('click', selectStudentRole);
        btnTabTeacher.addEventListener('click', selectTeacherRole);

        function togglePasswordVisibility(inputId, toggleIcon) {
            const passwordInput = document.getElementById(inputId);
            if (passwordInput) {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    toggleIcon.classList.remove('bi-eye-slash-fill');
                    toggleIcon.classList.add('bi-eye-fill');
                } else {
                    passwordInput.type = 'password';
                    toggleIcon.classList.remove('bi-eye-fill');
                    toggleIcon.classList.add('bi-eye-slash-fill');
                }
            }
        }

        // Auto-select role if provided via query param or hash, e.g. /signup?role=teacher or /signup#teacher
        document.addEventListener('DOMContentLoaded', function () {
            try {
                const params = new URLSearchParams(window.location.search);
                if (params.get('role') === 'teacher' || window.location.hash === '#teacher') {
                    selectTeacherRole();
                }
            } catch (e) {
                if (window.location.hash === '#teacher') {
                    selectTeacherRole();
                }
            }
        });

    </script>
   

    <script src="/js/user_auth/signin.js"></script>
    <script src="/js/loder.js"></script>
    <script src="/js/inspect_off.js"></script>


</body>

</html>
