<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - X compiler</title>
     <link rel="icon" type="image/png" href="/asset/logo.png">

    <!-- cdn link  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- css file -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth_css/signin.css">
    <link rel="stylesheet" href="/css/loder/loder.css">
    <script src="/js/custom-alert.js"></script>
</head>

<body>
    <!-- loder -->
    <div class="login-loder">
        <div class="loader">
            <span><span></span><span></span><span></span><span></span></span>
            <div class="base">
                <span></span>
                <div class="face"></div>
            </div>
        </div>
        <div class="longfazers">
            <span></span><span></span><span></span><span></span>
        </div>
    </div>

<!-- sign up div -->
    <main class="auth-wrapper" id="authWrapper">
        <div class="auth-container signup-container" id="authContainer" style="position: relative; z-index: 10;">
            <a href="/" class="back-to-home-link"><i class="bi bi-arrow-left"></i> Back to Home</a>

            <div class="auth-card">
                <div class="auth-header">
                    <img src="../asset/logo.png" class="fa-brands fa-magento brand-icon" alt="brand logo">
                    <h2 id="authTitle">Join X Compiler</h2>
                    <p id="authSubtitle">Create an account to track your progress and compete globally as a student.</p>
                </div>

                <div class="persona-selector-container" id="personaSelectorContainer">
                    <div class="persona-indicator" id="personaIndicator"></div>
                    <button class="persona-tab active" id="btnTabStudent" type="button">
                        <i class="bi bi-mortarboard-fill me-2"></i>Student
                    </button>
                    <button class="persona-tab" id="btnTabTeacher" type="button">
                        <i class="bi bi-person-workspace me-2"></i>Teacher
                    </button>
                </div>

                <div class="auth-form-wrapper">
                    <form class="auth-form" id="formSignup">
                        <div class="form-group">
                            <label for="signupName">Full Name</label>
                            <div class="input-wrapper">
                                <i class="bi bi-person-fill input-icon"></i>
                                <input class="input-control" type="text" id="signupName" required
                                    placeholder="full name">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="signupEmail">Email Address</label>
                            <div class="input-wrapper">
                                <i class="bi bi-envelope-fill input-icon"></i>
                                <input class="input-control" type="email" id="signupEmail" required
                                    placeholder="name@domain.com">
                            </div>
                        </div>

                        <div class="form-group form-group-dynamic active" id="groupStudentId">
                            <label for="signupStudentId">Student Roll Number</label>
                            <div class="input-wrapper">
                                <i class="bi bi-card-list input-icon"></i>
                                <input class="input-control" type="text" id="signupStudentId" required
                                    placeholder="university rollnumber">
                            </div>
                        </div>
                        <div class="form-group form-group-dynamic active" id="groupStudentDept">
                            <div class="row gx-3">
                                <div class="col-6">
                                    <label for="signupStudentDept">Department</label>
                                    <div class="custom-select-container" id="deptSelectContainer">
                                        <div class="input-wrapper select-wrapper">
                                            <i class="bi bi-mortarboard-fill input-icon"></i>
                                            <div class="input-control custom-select-trigger" id="deptSelectTrigger" tabindex="0" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="deptDropdown">
                                                <span class="selected-value">Select Dept</span>
                                            </div>
                                        </div>
                                        <select class="visually-hidden-select" id="signupStudentDept" required>
                                            <option value="" disabled selected>Select Dept</option>
                                            <option value="data-science">Bsc Data Science</option>
                                            <option value="cyber-security">Bsc Cyber Security</option>
                                            <option value="bca">BCA</option>
                                        </select>
                                        <div class="custom-select-dropdown" id="deptDropdown" role="listbox">
                                            <div class="dropdown-option" data-value="data-science" role="option" tabindex="0">
                                                <i class="bi bi-database-fill me-2 option-icon"></i>Bsc Data Science
                                            </div>
                                            <div class="dropdown-option" data-value="cyber-security" role="option" tabindex="0">
                                                <i class="bi bi-shield-lock-fill me-2 option-icon"></i>Bsc Cyber Security
                                            </div>
                                            <div class="dropdown-option" data-value="bca" role="option" tabindex="0">
                                                <i class="bi bi-code-slash me-2 option-icon"></i>BCA
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <label for="signupStudentSem">Semester</label>
                                    <div class="input-wrapper">
                                        <i class="bi bi-calendar3 input-icon"></i>
                                        <input class="input-control" type="number" id="signupStudentSem" required
                                            placeholder="Current sem" min="1" max="8">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="signupPassword">Password</label>
                            <div class="input-wrapper">
                                <i class="bi bi-lock-fill input-icon"></i>
                                <input class="input-control password-input" type="password" id="signupPassword" required
                                    placeholder="••••••••">
                                <i class="bi bi-eye-slash-fill toggle-password"
                                    onclick="togglePasswordVisibility('signupPassword', this)"></i>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="signupConfirmPassword">Confirm Password</label>
                            <div class="input-wrapper">
                                <i class="bi bi-shield-lock-fill input-icon"></i>
                                <input class="input-control password-input" type="password" id="signupConfirmPassword"
                                    required placeholder="••••••••">
                                <i class="bi bi-eye-slash-fill toggle-password"
                                    onclick="togglePasswordVisibility('signupConfirmPassword', this)"></i>
                            </div>
                        </div>

                        <button class="btn-auth-submit btn-signup-submit" type="submit" id="btnSubmitSignup">
                            <span class="spinner-border spinner-border-sm me-2 d-none" id="signupLoader" role="status" aria-hidden="true"></span>
                            <span id="signupBtnText"><i class="bi bi-person-plus-fill me-1"></i> Create Account</span>
                        </button>
                    </form>
                </div>

                <div class="auth-card-footer mt-4 text-center">
                    <p class="mb-0" style="font-size: 0.9rem;">
                        Already have an account? <a href="/signin" class="auth-redirect-link">Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script>
        const btnTabStudent = document.getElementById('btnTabStudent');
        const btnTabTeacher = document.getElementById('btnTabTeacher');
        const personaSelectorContainer = document.getElementById('personaSelectorContainer');
        const groupStudentId = document.getElementById('groupStudentId');
        const groupStudentDept = document.getElementById('groupStudentDept');
        const signupStudentId = document.getElementById('signupStudentId');
        const signupStudentDept = document.getElementById('signupStudentDept');
        const signupStudentSem = document.getElementById('signupStudentSem');
        const btnSubmitSignup = document.getElementById('btnSubmitSignup');
        const authSubtitle = document.getElementById('authSubtitle');

        let activeRole = 'student';

        function selectStudentRole() {
            btnTabStudent.classList.add('active');
            btnTabTeacher.classList.remove('active');
            personaSelectorContainer.classList.remove('teacher-active');
            groupStudentId.classList.add('active');
            groupStudentDept.classList.add('active');
            signupStudentId.required = true;
            signupStudentDept.required = true;
            signupStudentSem.required = true;
            // teacher unique removed from signup
            btnSubmitSignup.className = "btn-auth-submit btn-signup-submit";
            btnSubmitSignup.removeAttribute('style');
            activeRole = 'student';
            authSubtitle.innerText = "Create an account to track your progress and compete globally as a student.";
        }

        function selectTeacherRole() {
            btnTabStudent.classList.remove('active');
            btnTabTeacher.classList.add('active');
            personaSelectorContainer.classList.add('teacher-active');
            groupStudentId.classList.remove('active');
            groupStudentDept.classList.remove('active');
            signupStudentId.required = false;
            signupStudentDept.required = false;
            signupStudentSem.required = false;
            // teacher unique removed from signup
            btnSubmitSignup.style.backgroundColor = "#ffffff";
            btnSubmitSignup.style.borderColor = "#3b82f6";
            btnSubmitSignup.style.color = "#0d0f12";
            activeRole = 'teacher';
            authSubtitle.innerText = "Create an account to track your progress and compete globally as a teacher.";
        }

        btnTabStudent.addEventListener('click', selectStudentRole);
        btnTabTeacher.addEventListener('click', selectTeacherRole);

        function togglePasswordVisibility(inputId, toggleIcon) {
            const passwordInput = document.getElementById(inputId);
            if (passwordInput) {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    toggleIcon.classList.remove('bi-eye-slash-fill');
                    toggleIcon.classList.add('bi-eye-fill');
                } else {
                    passwordInput.type = 'password';
                    toggleIcon.classList.remove('bi-eye-fill');
                    toggleIcon.classList.add('bi-eye-slash-fill');
                }
            }
        }

        // Custom Dropdown Menu logic for Select Department field
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("deptSelectContainer");
            const trigger = document.getElementById("deptSelectTrigger");
            const dropdown = document.getElementById("deptDropdown");
            const select = document.getElementById("signupStudentDept");
            const valueSpan = trigger.querySelector(".selected-value");

            if (!container || !trigger || !dropdown || !select) return;

            // Toggle dropdown on trigger click
            trigger.addEventListener("click", (e) => {
                e.stopPropagation();
                const isOpen = container.classList.toggle("open");
                trigger.setAttribute("aria-expanded", isOpen ? "true" : "false");
            });

            // Option selection logic
            const options = dropdown.querySelectorAll(".dropdown-option");
            const optionsArray = Array.from(options);
            let focusedOptionIndex = -1;

            function setOptionFocus(index) {
                if (index >= 0 && index < optionsArray.length) {
                    focusedOptionIndex = index;
                    optionsArray[index].focus();
                }
            }

            options.forEach((option) => {
                option.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const value = option.getAttribute("data-value");
                    const text = option.textContent.trim();

                    // Update hidden select
                    select.value = value;
                    select.dispatchEvent(new Event("change"));

                    // Update visible selected text
                    valueSpan.textContent = text;
                    valueSpan.classList.add("has-value");

                    // Mark selected option
                    options.forEach(opt => opt.classList.remove("selected"));
                    option.classList.add("selected");

                    // Close dropdown
                    container.classList.remove("open");
                    trigger.setAttribute("aria-expanded", "false");
                    trigger.focus();
                });
            });

            // Close dropdown when clicking outside
            document.addEventListener("click", (e) => {
                if (!container.contains(e.target)) {
                    container.classList.remove("open");
                    trigger.setAttribute("aria-expanded", "false");
                }
            });

            // Keyboard accessibility
            trigger.addEventListener("keydown", (e) => {
                if (e.key === "ArrowDown" || e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    if (!container.classList.contains("open")) {
                        container.classList.add("open");
                        trigger.setAttribute("aria-expanded", "true");
                    }
                    const selectedIndex = optionsArray.findIndex(opt => opt.classList.contains("selected"));
                    setOptionFocus(selectedIndex >= 0 ? selectedIndex : 0);
                } else if (e.key === "Escape") {
                    container.classList.remove("open");
                    trigger.setAttribute("aria-expanded", "false");
                }
            });

            optionsArray.forEach((option, index) => {
                option.addEventListener("keydown", (e) => {
                    if (e.key === "ArrowDown") {
                        e.preventDefault();
                        setOptionFocus((index + 1) % optionsArray.length);
                    } else if (e.key === "ArrowUp") {
                        e.preventDefault();
                        setOptionFocus((index - 1 + optionsArray.length) % optionsArray.length);
                    } else if (e.key === "Enter" || e.key === " ") {
                        e.preventDefault();
                        option.click();
                    } else if (e.key === "Escape") {
                        e.preventDefault();
                        container.classList.remove("open");
                        trigger.setAttribute("aria-expanded", "false");
                        trigger.focus();
                    }
                });
            });

            // Synchronize selection changes back to custom UI in case reset externally
            select.addEventListener("change", () => {
                const val = select.value;
                if (!val) {
                    valueSpan.textContent = "Select Dept";
                    valueSpan.classList.remove("has-value");
                    options.forEach(opt => opt.classList.remove("selected"));
                } else {
                    const correspondingOpt = dropdown.querySelector(`.dropdown-option[data-value="${val}"]`);
                    if (correspondingOpt) {
                        valueSpan.textContent = correspondingOpt.textContent.trim();
                        valueSpan.classList.add("has-value");
                        options.forEach(opt => opt.classList.remove("selected"));
                        correspondingOpt.classList.add("selected");
                    }
                }
            });
        });
    </script>

   
    <script src="/js/user_auth/signup.js"></script>
    <script src="/js/loder.js"></script>
    <script src="/js/inspect_off.js"></script>
</body>

</html>
