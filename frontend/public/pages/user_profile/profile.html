<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile - ML Compiler</title>
  <link rel="icon" type="image/png" href="/asset/magento-brands-solid-full.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/profile.css">
</head>
<body style="min-height: 100vh; overflow-y: auto; background-color: #0d0f12;">
  <nav class="custom-navbar"></nav>

  <div class="starry-background-canvas">
    <div id="stars"></div>
    <div id="stars2"></div>
    <div id="stars3"></div>
  </div>

  <main class="profile-main">
    <div class="profile-container">
      <div class="avatar-section">
        <div class="profile-avatar-circle" id="avatarCircle">
          <span id="avatarInitials">U</span>
          <div class="avatar-overlay">
            <i class="bi bi-camera"></i>
          </div>
        </div>
        <input type="file" id="avatarInput" accept="image/*" style="display: none;">
        <h1 id="profileName">User</h1>
        <span class="badge-role" id="profileRoleBadge">Student</span>
      </div>

      <div class="profile-details">
        <div class="detail-item">
          <label>Email Address</label>
          <span id="profileEmail">user@example.com</span>
        </div>
        
        <div class="detail-item student-only" id="studentDeptGroup" style="display: none;">
          <label>Department</label>
          <span id="profileDept">Computer Science</span>
        </div>

        <div class="detail-item student-only" id="studentSemGroup" style="display: none;">
          <label>Semester</label>
          <span id="profileSem">4</span>
        </div>

        <div class="detail-item student-only" id="studentRollGroup" style="display: none;">
          <label>Roll Number</label>
          <span id="profileRoll">CS202409</span>
        </div>
      </div>

      <div class="profile-actions">
        <button type="button" class="action-btn secondary-btn" id="btnBackHome">
          <i class="bi bi-arrow-left"></i> Home
        </button>
        <button type="button" class="action-btn primary-btn" id="btnEditProfile">
          <i class="bi bi-pencil-square"></i> Edit Profile
        </button>
      </div>
    </div>
  </main>

  <script src="/js/navbar.js"></script>
  <script src="/js/profile/user_profile.js"></script>
</body>
</html>
