<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Profile — X Compiler</title>
  <meta name="description"
    content="View and manage your X-Compiler account profile, personal details, and academic information." />
  <link rel="icon" type="image/png" href="/asset/logo.png">

  <!-- cdn link  -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

  <!-- css file -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/profile.css">
  <script src="/js/custom-alert.js"></script>
</head>


<body>
  <nav class="custom-navbar"></nav>

  <main class="profile-main">
    <div class="profile-container">

      <!-- ── AVATAR & IDENTITY SECTION ── -->
      <div class="avatar-section">
        <div class="profile-avatar-circle" id="avatarCircle">
          <span id="avatarInitials">U</span>
          <div class="avatar-overlay">
            <i class="bi bi-camera"></i>
          </div>
        </div>
        <input type="file" id="avatarInput" accept="image/*">
        <h1 id="profileName" class="skeleton skeleton-text">
          &nbsp;
        </h1>
        <span class="badge-role skeleton" id="profileRoleBadge">&nbsp;</span>

      </div>

      <!-- ── INFO DETAILS SECTION ── -->
      <div class="profile-details">
        <div class="detail-item">
          <label><i class="bi bi-envelope me-2"></i>Email Address</label>
          <span id="profileEmail" class="skeleton skeleton-inline">&nbsp;</span>
        </div>

        <div class="detail-item student-only" id="studentDeptGroup">
          <label><i class="bi bi-building me-2"></i>Department</label>
          <span id="profileDept" class="skeleton skeleton-inline">&nbsp;</span>
        </div>

        <div class="detail-item student-only" id="studentSemGroup">
          <label><i class="bi bi-mortarboard me-2"></i>Semester</label>
          <span id="profileSem" class="skeleton skeleton-inline">&nbsp;</span>
        </div>

        <div class="detail-item student-only" id="studentRollGroup">
          <label><i class="bi bi-hash me-2"></i>Roll Number</label>
          <span id="profileRoll" class="skeleton skeleton-inline">&nbsp;</span>
        </div>
      </div>

      <!-- ── ACTION BUTTONS ── -->
      <div class="profile-actions">
        <button type="button" class="action-btn secondary-btn" id="btnBackHome">
          <i class="bi bi-arrow-left"></i> Home
        </button>
        <button type="button" class="action-btn primary-btn" id="btnEditProfile">
          <i class="bi bi-pencil-square"></i> Edit Profile
        </button>
      </div>

    </div>
  </main>

  
  <!-- ══════════════════════════════════════════════════
       EDIT PROFILE MODAL
  ══════════════════════════════════════════════════ -->
  <div id="editProfileModal" class="edit-modal-backdrop" role="dialog" aria-modal="true" aria-label="Edit Profile">
    <div id="modalOverlay" class="modal-overlay"></div>
    <div class="edit-modal-card">
      <div class="modal-header-row">
        <div>
          <h2 class="modal-title">Edit Profile</h2>
          <p class="modal-subtitle">Update your display name and details</p>
        </div>
        <button class="modal-close-btn" id="modalClose" aria-label="Close modal">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <form id="editProfileForm" autocomplete="off" novalidate>
        <div class="form-field-group">
          <label class="field-label" for="editName">Display Name</label>
          <div class="field-input-wrapper">
            <i class="bi bi-person field-icon"></i>
            <input type="text" id="editName" class="field-input" placeholder="Your full name" maxlength="60" required />
          </div>
        </div>

        <div class="form-field-group student-only" style="display: none;">
          <label class="field-label" for="editDept">Department</label>
          <div class="field-input-wrapper">
            <i class="bi bi-building field-icon"></i>
            <input type="text" id="editDept" class="field-input" placeholder="e.g. Bsc Data Science" maxlength="80"
              disabled />
          </div>
          <p class="field-hint">Contact your institution admin to change department</p>
        </div>

        <div class="form-field-group student-only" style="display: none;">
          <label class="field-label" for="editSem">Semester</label>
          <div class="field-input-wrapper">
            <i class="bi bi-mortarboard field-icon"></i>
            <input type="number" id="editSem" class="field-input" placeholder="e.g. 4" min="1" max="12" disabled />
          </div>
          <p class="field-hint">Contact your institution admin to change semester</p>
        </div>

        <div class="modal-actions">
          <button type="button" class="action-btn secondary-btn" id="cancelEditBtn">Cancel</button>
          <button type="submit" class="action-btn primary-btn" id="saveProfileBtn">
            <i class="bi bi-check-lg"></i> Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/navbar.js"></script>
  <script src="/js/profile/user_profile.js"></script>
  <script src="/js/inspect_off.js"></script>
</body>

</html>
